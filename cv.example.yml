# Your profile, as the scoring agent sees it.
#
# Copy this to cv.yml and replace every value with your own. cv.yml is
# gitignored, and in deployment it lives in the private state repository, so
# your details never reach this public one.
#
# This template contains placeholder values only. Keep it that way: anything
# written here is published with the code.
#
# Skills are resolved through the same taxonomy the extraction agent uses, so
# "sklearn" and "scikit-learn" are the same thing. Anything the taxonomy does
# not recognise is kept as written but cannot earn partial credit.

name: Your Name

# One of: junior, mid, senior, lead
seniority: junior

years_experience: 2

preferred_locations:
  - London

# Roles advertising below this are scored down. Remove the line to ignore salary.
minimum_salary: 30000

open_to_remote: true

skills:
  - Python
  - SQL
  - pandas
  - scikit-learn
  - Git

# Free text. Scanned for skills your list above might have missed, so anything
# mentioned in a project description still counts.
summary: >
  A short description of your experience and projects. Any tools you mention
  here are picked up as skills.
