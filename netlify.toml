# Netlify builds the site from this repository on every push. The weekly job
# commits a fresh snapshot each Monday, which is what triggers the rebuild.

[build]
  # Paths below are relative to this base, which is why publish is "dist"
  # rather than "frontend/dist".
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

# Every path in this file is resolved relative to the base above, so this is
# frontend/netlify/functions. Putting the functions outside the base and giving
# a repository root path here silently finds nothing, and every call to the
# function returns 404.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"

# Client side routing: every unknown path is served the app, which then decides
# what to render. Without this, refreshing /roles returns a 404 from Netlify.
# frontend/public/_redirects says the same thing and ships in the build output.
